
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #cccccc;
        }

        h1 {
            text-align: center;
            color: #263b70;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        input, select, button {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input, select {
            flex: 1;
            min-width: 120px;
        }

        button {
            background: #3157a4;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #1d3670;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #3157a4;
            color: white;
        }

        .delete {
            background: #dc3545;
        }

        #message {
            text-align: center;
            margin: 12px;
            color: #263b70;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Management System</h1>

        <h3>Add New Student</h3>

        <div class="form">
            <input type="text" id="name" placeholder="Student Name">
            <input type="number" id="age" placeholder="Age">
            <select id="course">
                <option value="">Select Course</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="IT">IT</option>
                <option value="EEE">EEE</option>
            </select>
            <button onclick="addStudent()">Add Student</button>
        </div>

        <p id="message"></p>

        <h3>Student Details</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <script>
        async function loadStudents() {
            const response = await fetch('/api/students');
            const students = await response.json();

            const table = document.getElementById('studentTable');
            table.innerHTML = '';

            students.forEach(student => {
                const row = document.createElement('tr');

                [student.id, student.name, student.age, student.course]
                    .forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                const actionCell = document.createElement('td');
                const deleteButton = document.createElement('button');

                deleteButton.textContent = 'Delete';
                deleteButton.className = 'delete';
                deleteButton.onclick = () => deleteStudent(student.id);

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                table.appendChild(row);
            });
        }

        async function addStudent() {
            const name = document.getElementById('name').value.trim();
            const age = Number(document.getElementById('age').value);
            const course = document.getElementById('course').value;

            if (!name || !Number.isInteger(age) || age <= 0 || !course) {
                document.getElementById('message').textContent =
                    'Please enter valid student details.';
                return;
            }

            const response = await fetch('/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, age, course })
            });

            const result = await response.json();

            document.getElementById('message').textContent =
                response.ok ? 'Student added successfully!' : result.message;

            if (response.ok) {
                document.getElementById('name').value = '';
                document.getElementById('age').value = '';
                document.getElementById('course').value = '';
                loadStudents();
            }
        }

        async function deleteStudent(id) {
            const response = await fetch('/api/students/' + id, {
                method: 'DELETE'
            });

            const result = await response.json();

            document.getElementById('message').textContent = result.message;
            loadStudents();
        }

        loadStudents();
    </script>
</body>
</html>
